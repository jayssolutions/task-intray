global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Discovers app instances by tag instead of hard-coded hostnames.
  # Runs on the monitoring EC2 instance (terraform/modules/monitoring): its IAM role
  # grants ec2:DescribeInstances, and the region comes from instance metadata.
  - job_name: "task-intray"
    metrics_path: /metrics
    ec2_sd_configs:
      - port: 3000
        filters:
          - name: tag:Role
            values: ["application"]
          - name: instance-state-name
            values: ["running"]
    relabel_configs:
      # Scrape via private IP (Prometheus runs inside the VPC).
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        replacement: "$1:3000"
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
