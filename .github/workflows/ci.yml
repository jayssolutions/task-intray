name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.16.1"

jobs:
  app:
    name: App (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage

      - name: Build deployable archive
        # Layout matches what ansible/playbook.yml extracts into app_dir.
        run: tar -czf ../app.tar.gz package.json package-lock.json src

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: app.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage
          retention-days: 7

  terraform:
    name: Terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      - name: Checkov security scan (report only)
        # soft_fail until the security hardening items are addressed;
        # flip to false to make findings block merges.
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true

  ansible:
    name: Ansible (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ansible-lint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: ansible-lint ansible/playbook.yml ansible/monitoring.yml

  configs:
    name: Scripts & monitoring configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Validate Prometheus config and alert rules
        # Mounted at /etc/prometheus so the absolute rule_files path resolves.
        # Keep the image tag in sync with prometheus_version in ansible/monitoring.yml.
        run: >
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
