input {
  beats {
    port => 5044
  }
}

filter {
  # The app writes structured JSON log lines; expand them into fields.
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "task-intray-%{+YYYY.MM.dd}"
  }
}
