---
- name: Install and configure Prometheus
  hosts: monitoring
  become: true

  vars:
    prometheus_version: "3.14.0"
    prometheus_arch: amd64
    prometheus_dist: "prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}"
    prometheus_release_url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}"
    prometheus_install_dir: "/opt/{{ prometheus_dist }}"
    prometheus_retention: 15d
    monitoring_config_dir: "{{ playbook_dir }}/../monitoring"

  tasks:
    - name: Create prometheus user
      ansible.builtin.user:
        name: prometheus
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Create config and data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: prometheus
        mode: "0755"
      loop:
        - { path: /etc/prometheus, owner: root }
        - { path: /var/lib/prometheus, owner: prometheus }

    - name: Download Prometheus release (checksum verified)
      ansible.builtin.get_url:
        url: "{{ prometheus_release_url }}/{{ prometheus_dist }}.tar.gz"
        dest: "/tmp/{{ prometheus_dist }}.tar.gz"
        checksum: "sha256:{{ prometheus_release_url }}/sha256sums.txt"
        mode: "0644"

    - name: Extract Prometheus
      ansible.builtin.unarchive:
        src: "/tmp/{{ prometheus_dist }}.tar.gz"
        dest: /opt
        remote_src: true
        creates: "{{ prometheus_install_dir }}/prometheus"

    - name: Link Prometheus binaries
      ansible.builtin.file:
        src: "{{ prometheus_install_dir }}/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
      loop:
        - prometheus
        - promtool
      notify: Restart prometheus

    - name: Install alert rules
      ansible.builtin.copy:
        src: "{{ monitoring_config_dir }}/alerts.yml"
        dest: /etc/prometheus/alerts.yml
        owner: root
        group: prometheus
        mode: "0644"
        validate: /usr/local/bin/promtool check rules %s
      notify: Reload prometheus

    - name: Install Prometheus config
      ansible.builtin.copy:
        src: "{{ monitoring_config_dir }}/prometheus.yml"
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: prometheus
        mode: "0644"
        validate: /usr/local/bin/promtool check config %s
      notify: Reload prometheus

    - name: Install systemd service
      ansible.builtin.template:
        src: templates/prometheus.service.j2
        dest: /etc/systemd/system/prometheus.service
        mode: "0644"
      notify: Restart prometheus

    - name: Ensure Prometheus is running
      ansible.builtin.systemd:
        name: prometheus
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply pending restarts or reloads
      ansible.builtin.meta: flush_handlers

    - name: Wait for Prometheus to be ready
      ansible.builtin.uri:
        url: http://localhost:9090/-/ready
      register: prometheus_ready
      until: prometheus_ready.status == 200
      retries: 12
      delay: 5

  handlers:
    - name: Restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
        daemon_reload: true

    - name: Reload prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: reloaded
