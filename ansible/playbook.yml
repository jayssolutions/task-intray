---
- name: Configure and deploy Node.js application
  hosts: app
  become: true
  serial: 1

  vars:
    app_name: task-intray
    app_dir: /opt/task-intray
    app_port: 3000
    node_major: 22
    app_archive: "{{ lookup('env', 'APP_ARCHIVE') | default('../app.tar.gz', true) }}"

  tasks:
    - name: Install Node.js and npm
      ansible.builtin.dnf:
        name:
          - "nodejs{{ node_major }}"
          - "nodejs{{ node_major }}-npm"
          - tar
        state: present

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_name }}"
        system: true
        shell: /sbin/nologin

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
        mode: "0755"

    - name: Copy application archive
      ansible.builtin.copy:
        src: "{{ app_archive }}"
        dest: /tmp/app.tar.gz
        mode: "0644"

    - name: Extract application
      ansible.builtin.unarchive:
        src: /tmp/app.tar.gz
        dest: "{{ app_dir }}"
        remote_src: true
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
      notify: Restart application

    - name: Install production dependencies
      community.general.npm:
        path: "{{ app_dir }}"
        executable: "/usr/bin/npm-{{ node_major }}"
        production: true
      become_user: "{{ app_name }}"
      notify: Restart application

    - name: Install systemd service
      ansible.builtin.template:
        src: templates/app.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
      notify: Restart application

    - name: Ensure service is running
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart application
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: true
